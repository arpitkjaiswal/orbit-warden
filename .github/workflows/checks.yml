name: Game checks
on:
  push:
  pull_request:
concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Python gameplay logic tests
        run: python -m unittest discover -s tests -v
      - name: Browser game logic tests
        run: node --test web/tests/*.test.mjs
      - name: Python syntax compile
        run: python -m compileall -q orbit_warden
      - name: Browser JS syntax check
        run: |
          node --check web/main.js
          node --check web/logic.js
          node --check web/gestures.js
          node --check web/gesture-logic.js
          node --check web/feedback.js
          node --check web/adventure.js
          node --check web/input.js
  verify-deployment:
    name: Verify public Render release
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Wait for the exact game release on Render
        run: python scripts/verify_deployment.py --wait 600 --interval 15 --timeout 15
